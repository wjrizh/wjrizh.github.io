{{- /* 右下角背景音乐播放器：跨页面续播 + 自动尝试播放 */ -}}
<div id="bgm-player" title="The Dark Side of the Moon">
  <button id="bgm-toggle" aria-label="播放/暂停音乐">♪</button>
  <span class="bgm-title"><span class="note">♪</span>Rocket Man</span>
  <audio id="bgm-audio" loop preload="auto" src="{{ "music/rocket-man.mp3" | relURL }}"></audio>
</div>
<script>
(function () {
  var player = document.getElementById('bgm-player');
  var btn = document.getElementById('bgm-toggle');
  var audio = document.getElementById('bgm-audio');
  if (!player || !btn || !audio) return;

  var KEY = 'bgm-state';

  function markPlaying() { player.classList.add('playing'); btn.textContent = '❚❚'; }
  function markPaused() { player.classList.remove('playing'); btn.textContent = '♪'; }

  // wantPlay 表示"用户意图是否在播放"，与 audio.paused 解耦，
  // 避免页面卸载时浏览器触发的 pause 事件把状态误写为 false。
  var saved = {};
  try { saved = JSON.parse(sessionStorage.getItem(KEY) || '{}'); } catch (e) {}
  // 默认自动播放（用户未主动暂停过）；用户主动暂停后 saved.playing=false。
  var wantPlay = saved.playing === undefined ? true : saved.playing === true;
  if (typeof saved.t === 'number' && saved.t > 0) {
    audio.currentTime = saved.t;
  }

  function save() {
    try {
      sessionStorage.setItem(KEY, JSON.stringify({
        t: audio.currentTime,
        playing: wantPlay
      }));
    } catch (e) {}
  }

  function tryPlay() {
    var p = audio.play();
    if (p && p.then) {
      p.then(markPlaying).catch(function () {
        bindGesture();
      });
    }
  }

  var gestureBound = false;
  function bindGesture() {
    if (gestureBound) return;
    gestureBound = true;
    var once = function () {
      document.removeEventListener('click', once, true);
      document.removeEventListener('keydown', once, true);
      document.removeEventListener('touchstart', once, true);
      document.removeEventListener('scroll', once, true);
      if (!wantPlay) { markPaused(); return; }
      tryPlay();
    };
    document.addEventListener('click', once, true);
    document.addEventListener('keydown', once, true);
    document.addEventListener('touchstart', once, true);
    document.addEventListener('scroll', once, true);
  }

  btn.addEventListener('click', function () {
    if (audio.paused) {
      wantPlay = true;
      audio.play().then(markPlaying).catch(function () {});
    } else {
      wantPlay = false;
      audio.pause();
      markPaused();
    }
    save();
  });

  audio.addEventListener('timeupdate', save);

  // 页面卸载前落盘当前进度与意图
  window.addEventListener('pagehide', save);
  window.addEventListener('beforeunload', save);

  // 进入页面：续播或自动尝试播放
  if (wantPlay) {
    tryPlay();
  } else {
    // 用户从未播放过或主动暂停过：不自动播放
    markPaused();
  }
})();
</script>
